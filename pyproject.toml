[project]
name = "farmaka-info"
version = "0.0.1"
description = "Open Greek medicinal product data: prices, reimbursement, product information"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
pdf = ["pdfplumber>=0.11"]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ingest"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
filterwarnings = ["ignore::UserWarning:openpyxl.*"]
