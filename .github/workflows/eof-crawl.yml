# Nightly, very slow crawl of EOF SmPC / package leaflet documents (Δ-18), then the
# documents in sections (Δ-24).
# The crawler itself refuses to run outside 00:00-07:00 Athens time, keeps
# >=10 s between requests, stops on 403/429 and on a data/eof/STOP file.
# Documents stay in the Actions cache; the daily job only needs the links file and
# the texts in sections, kept in their own small cache.
name: eof-crawl
on:
  schedule:
    # GitHub may start scheduled runs hours late (3.5 h on 15/11/2026) or drop them.
    # A second trigger covers a dropped run; outside 00:00-07:00 Athens the crawler
    # refuses to start (exit 2), which is not a failure.
    - cron: "5 22 * * *" # 00:05 Athens in winter, 01:05 in summer
    - cron: "35 0 * * *" # 02:35 Athens in winter, 03:35 in summer
  workflow_dispatch:
    inputs:
      any_time:
        description: "Run now, outside the 00:00-07:00 window (same pacing; owner's decision)"
        type: boolean
        default: true
      until_done:
        description: "When this run ends with products left, start the next one (same pacing)"
        type: boolean
        default: false
concurrency:
  group: eof-crawl
  cancel-in-progress: false
permissions:
  contents: read
  actions: write # only to start the next run when until_done is set
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Restore the price list (for package codes)
        uses: actions/cache/restore@v4
        with:
          path: |
            data
            !data/eof
            !data/eof-links
          key: moh-data-none
          restore-keys: moh-data-
      - name: Restore EOF documents
        uses: actions/cache/restore@v4
        with:
          path: data/eof
          key: eof-docs-${{ github.run_id }}
          restore-keys: eof-docs-
      - name: Price list for package codes (offline from the samples if the cache is empty)
        run: |
          if [ ! -f data/current/packages.csv ]; then
            python -m ingest.build --manifest data/manifest_prices.json --raw data/raw --out data/current
          fi
      - name: Crawl (stops by itself at 07:00 Athens time)
        id: crawl
        run: |
          set +e
          python -m ingest.eof crawl --packages data/current/packages.csv data/current/otc_packages.csv --out data/eof --max-minutes 300 ${{ (github.event_name == 'workflow_dispatch' && inputs.any_time) && '--any-time' || '' }}
          code=$?
          if [ $code -eq 2 ]; then echo "Outside the 00:00-07:00 Athens window or stopped by data/eof/STOP: nothing to do."; exit 0; fi
          if [ $code -eq 5 ]; then
            echo "services.eof.gr stayed unavailable (502/503/504) and nothing was fetched: no next run now."
            echo "chain=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit $code
      - name: Links
        if: always()
        run: |
          mkdir -p data/eof-links
          if [ -f data/eof/manifest.json ]; then
            python -m ingest.eof links --manifest data/eof/manifest.json --out data/eof-links/eof_docs.csv
          fi
      - name: LibreOffice, for the Word and RTF documents
        if: always()
        run: |
          if [ -d data/eof/pdf ] && ls data/eof/pdf | grep -qiE '\.(docx?|rtf)$'; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends libreoffice-writer-nogui || sudo apt-get install -y -qq --no-install-recommends libreoffice-writer
          fi
      - name: Documents in sections (only the new or changed ones)
        if: always()
        continue-on-error: true
        run: |
          if [ -f data/eof/manifest.json ]; then
            python -m ingest.eof_pi parse --root data/eof --out data/eof/pi --jobs 4
            rm -rf data/eof-links/eof_pi && cp -r data/eof/pi data/eof-links/eof_pi
          fi
      - name: Save EOF documents
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/eof
          key: eof-docs-${{ github.run_id }}
      - name: Save links and texts for the daily job
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/eof-links
          key: eof-links-${{ github.run_id }}
      - name: Next run, while products are left (until_done)
        if: success() && github.event_name == 'workflow_dispatch' && inputs.until_done && steps.crawl.outcome == 'success' && steps.crawl.outputs.chain != 'no'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f data/eof/STOP ]; then echo "data/eof/STOP exists: not starting another run"; exit 0; fi
          left=$(python -m ingest.eof remaining --packages data/current/packages.csv data/current/otc_packages.csv --manifest data/eof/manifest.json)
          echo "products left: $left"
          if [ "$left" -gt 0 ]; then
            gh workflow run eof-crawl.yml --ref "${{ github.ref_name }}" -f any_time=${{ inputs.any_time }} -f until_done=true
          fi
