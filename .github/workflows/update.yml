# Daily: fetch new MoH bulletins (politely, first 2 listing pages), rebuild the
# data and the site, deploy to Cloudflare. Downloaded bulletins are kept in the
# Actions cache between runs; the sample bulletins in git are always a fallback
# baseline, so a ministry outage never breaks the site.
name: update
on:
  schedule:
    # GitHub may start scheduled runs hours late or drop them; the second time is a
    # safety net. Runs never overlap (concurrency) and fetching is incremental.
    - cron: "23 5 * * *" # 07:23/08:23 Athens
    - cron: "23 11 * * *" # 13:23/14:23 Athens
  workflow_dispatch:
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -e ".[pdf]"
      - name: Restore downloaded bulletins
        uses: actions/cache/restore@v4
        with:
          path: |
            data
            !data/eof
            !data/eof-links
          key: moh-data-${{ github.run_id }}
          restore-keys: moh-data-
      - name: EMA product information in sections (from the cache, else the data-ema-pi release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(ls -A data/current/ema_pi 2>/dev/null)" ]; then
            mkdir -p data/current
            gh release download data-ema-pi --pattern ema_pi.tar.gz --dir "$RUNNER_TEMP" --clobber
            tar xzf "$RUNNER_TEMP/ema_pi.tar.gz" -C data/current
          fi
          ls data/current/ema_pi | wc -l
      - name: Restore EOF document links (from the nightly crawl)
        uses: actions/cache/restore@v4
        with:
          path: data/eof-links
          key: eof-links-none
          restore-keys: eof-links-
      - name: Backfill the complete price lists (once; the marker lives in the cache)
        continue-on-error: true
        run: |
          if [ ! -f data/.backfill-done ]; then
            python -m ingest.fetch --section prices --out data --backfill full && touch data/.backfill-done
          fi
      - name: Fetch new price bulletins
        # The ministry site is sometimes down; build with what we have.
        continue-on-error: true
        run: python -m ingest.fetch --section prices --out data --max-pages 2
      - name: Fetch new OTC (ΜΗ.ΣΥ.ΦΑ.) bulletins
        continue-on-error: true
        run: python -m ingest.fetch --section otc --out data --max-pages 3
      - name: Build data
        run: |
          python -m ingest.build --manifest data/manifest_prices.json --raw data/raw --out data/current
          if [ -f ingest/reimbursement.py ]; then
            python -m ingest.reimbursement --pdf samples/raw/katalogos_2026-10.pdf --list main --decimal . --article 14875 --published 2026-10-22 --out data/current/reimbursement_main.csv
            python -m ingest.reimbursement --pdf samples/raw/katalogos_n3816_2026-10.pdf --list n3816 --decimal , --article 14875 --published 2026-10-22 --out data/current/reimbursement_n3816.csv
          fi
      - name: Build OTC list (a failure here keeps the previous list)
        continue-on-error: true
        run: |
          if [ -f data/manifest_otc.json ]; then
            python -m ingest.otc --manifest data/manifest_otc.json --raw data/raw --out data/current
          fi
      - name: Link EMA product information (EMA files refreshed on Mondays)
        continue-on-error: true
        run: |
          refresh=""; [ "$(date -u +%u)" = "1" ] && refresh="--refresh"
          python -m ingest.ema --packages data/current/packages.csv --out data/current/ema_links.csv --cache data/ema $refresh
      - name: Shortage lists (EOF, EMA); a failure keeps yesterday's list
        continue-on-error: true
        run: |
          # once on a fresh cache: read every EOF listing page, so older lists (e.g. the
          # discontinuation list of 12/2025) are found; afterwards only the newest pages
          if [ ! -f data/shortages/.backfill-done ]; then
            python -m ingest.shortages fetch --out data/shortages --backfill --max-requests 120 && touch data/shortages/.backfill-done
          else
            python -m ingest.shortages fetch --out data/shortages --max-requests 30 || [ $? -eq 1 ]
          fi
          python -m ingest.shortages build --cache data/shortages --packages data/current/packages.csv --otc data/current/otc_packages.csv --out data/current
      - name: Save downloaded bulletins
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data
            !data/eof
            !data/eof-links
          key: moh-data-${{ github.run_id }}
      - name: Build site
        run: |
          if [ -f data/eof-links/eof_docs.csv ]; then cp data/eof-links/eof_docs.csv data/current/eof_docs.csv; fi
          python -m sitegen.build --data data/current --out dist
          test "$(find dist -type f | wc -l)" -gt 10000
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
      - name: Summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          r = json.load(open("data/current/build_report.json", encoding="utf-8"))
          print(f"- packages: {r['packages']}")
          print(f"- baseline: {r['baseline']['moh_article']} ({r['baseline']['published']})")
          print(f"- deltas applied: {[d['moh_article'] for d in r['deltas_applied']]}")
          print(f"- pending bulletins: {[p['moh_article'] for p in r['pending_bulletins']]}")
          print(f"- review queue: {len(r['review_queue'])}")
          PY
